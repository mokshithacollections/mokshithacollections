spring.application.name=mokshitha_collections

# Optional local secrets file (gitignored). Put real keys here for local dev;
# env vars still win in Docker/Render. Missing file is fine (optional:).
spring.config.import=optional:classpath:application-secrets.properties

# Console log pattern: include request id (rid) from MDC so a single request
# flow can be grepped across the log. Falls back to "-" when outside a request.
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [rid=%X{rid:--}] %logger{36} - %msg%n

# Active profile (set to "prod" in production via SPRING_PROFILES_ACTIVE env var)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Server
server.port=${SERVER_PORT:8080}
# Forward client IP / proto when behind a reverse proxy (nginx, ALB)
server.forward-headers-strategy=framework

# Datasource — REAL credentials come from env vars (Render) or the gitignored
# application-secrets.properties (local dev). The defaults below are harmless
# localhost values, safe to commit.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mokshitha_collections}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Session cookie hardening
server.servlet.session.cookie.name=MC_SESSIONID
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Set to true behind HTTPS (prod profile overrides this)
server.servlet.session.cookie.secure=false
server.servlet.session.timeout=30m

# Hide server header
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Thymeleaf — disable cache only in dev (overridden in prod)
spring.thymeleaf.cache=true

# Multipart (image uploads)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=20MB

# Local image storage (admin uploads)
app.uploads.root=${UPLOADS_ROOT:./uploads}
app.uploads.url-prefix=/uploads

# Email (Brevo SMTP) — real creds via env vars; NEVER commit the SMTP key.
spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
# "From" address (must be a verified sender in Brevo) + display name.
app.mail.from=${MAIL_FROM:mokshithacollections@gmail.com}
app.mail.from-name=${MAIL_FROM_NAME:Mokshitha Collections}
# Base URL used to build the reset link in emails (set to your live URL in prod).
app.base-url=${APP_BASE_URL:http://localhost:8080}
# How long a password-reset link stays valid (minutes).
app.password-reset.expiry-minutes=${PASSWORD_RESET_EXPIRY_MINUTES:30}

# Razorpay (test keys via env vars — NEVER hard-code real keys / commit them)
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
razorpay.currency=INR
# How long reserved stock is held while a payment is in flight (minutes)
app.checkout.hold-minutes=15
