# Prod profile overrides — loaded when spring.profiles.active=prod

# No SQL echo in production.
spring.jpa.show-sql=false

# Prefer 'validate' in prod (use migrations). Overridable via env so you can keep
# 'update' until a migration tool (Flyway/Liquibase) is in place:
#   set JPA_DDL_AUTO=update on Render for now; drop it once migrations exist.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}

spring.thymeleaf.cache=true
# Cookies must be HTTPS-only in prod
server.servlet.session.cookie.secure=true
# Strict-Transport-Security header — only safe to enable when actually on HTTPS.
app.security.hsts-enabled=true

# --- Logging: WARN and above only (no INFO, no DEBUG) ---
# Quiet production logs — only warnings and errors are recorded.
logging.level.root=WARN
logging.level.org.springframework=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN
logging.level.com.ec.mokshitha_collections=WARN
