<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/_layout :: head('Change Password')}"></head>
<body>
<style>
    .pw-wrap { max-width: 460px; }
    .pw-field { position: relative; }
    .pw-field input { width: 100%; padding-right: 44px; }
    .pw-toggle {
        position: absolute; top: 50%; right: 10px; transform: translateY(-50%);
        background: none; border: none; cursor: pointer; color: #888; font-size: 0.95rem; padding: 4px;
    }
    .pw-hint { font-size: 0.82rem; color: #6b7280; margin-top: 6px; }
</style>
<div class="admin-shell">
    <aside th:replace="~{admin/_layout :: sidebar('password')}"></aside>

    <main class="admin-main">
        <div class="admin-page-header">
            <div>
                <h1>Change Password</h1>
                <div class="breadcrumb">Update the password for your admin account</div>
            </div>
        </div>

        <div class="card pw-wrap">
            <form id="passwordForm">
                <div class="form-section">
                    <div class="form-row">
                        <label>Current password *</label>
                        <div class="pw-field">
                            <input type="password" name="currentPassword" id="currentPassword"
                                   autocomplete="current-password" required>
                            <button type="button" class="pw-toggle" data-target="currentPassword" aria-label="Show/hide">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="form-row">
                        <label>New password *</label>
                        <div class="pw-field">
                            <input type="password" name="newPassword" id="newPassword"
                                   autocomplete="new-password" required>
                            <button type="button" class="pw-toggle" data-target="newPassword" aria-label="Show/hide">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                        <div class="pw-hint">At least 8 characters, including one letter and one number.</div>
                    </div>

                    <div class="form-row">
                        <label>Confirm new password *</label>
                        <div class="pw-field">
                            <input type="password" name="confirmPassword" id="confirmPassword"
                                   autocomplete="new-password" required>
                            <button type="button" class="pw-toggle" data-target="confirmPassword" aria-label="Show/hide">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-key"></i> Update password
                    </button>
                </div>
            </form>
        </div>
    </main>
</div>

<div th:replace="~{admin/_layout :: scripts}"></div>
<script>
    // Show / hide each password field.
    document.querySelectorAll('.pw-toggle').forEach(function (btn) {
        btn.addEventListener('click', function () {
            var input = document.getElementById(btn.dataset.target);
            var icon = btn.querySelector('i');
            if (input.type === 'password') { input.type = 'text'; icon.className = 'fas fa-eye-slash'; }
            else { input.type = 'password'; icon.className = 'fas fa-eye'; }
        });
    });

    document.getElementById('passwordForm').addEventListener('submit', async function (e) {
        e.preventDefault();
        var fd = new FormData(e.target);
        var currentPassword = fd.get('currentPassword');
        var newPassword = fd.get('newPassword');
        var confirmPassword = fd.get('confirmPassword');

        if (newPassword !== confirmPassword) { toast('New passwords do not match', 'error'); return; }
        if (newPassword.length < 8) { toast('New password must be at least 8 characters', 'error'); return; }
        if (newPassword === currentPassword) { toast('New password must differ from the current one', 'error'); return; }

        var btn = e.target.querySelector('button[type="submit"]');
        var original = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Updating...';
        try {
            await adminApi('POST', '/api/admin/account/password', {
                currentPassword: currentPassword,
                newPassword: newPassword,
                confirmPassword: confirmPassword
            });
            toast('Password updated successfully', 'success');
            e.target.reset();
        } catch (err) {
            toast(err.message, 'error');
        } finally {
            btn.disabled = false;
            btn.innerHTML = original;
        }
    });
</script>
</body>
</html>
