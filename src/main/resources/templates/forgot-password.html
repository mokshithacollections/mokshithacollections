<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Mokshitha Collections</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root { --maroon: #55000c; --maroon-light: #880012; --gold: #D4AF37; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: #f3ede6; color: #2c3e50;
               min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .card { background: #fff; width: 100%; max-width: 430px; border-radius: 16px;
                box-shadow: 0 20px 50px -20px rgba(0,0,0,0.25); overflow: hidden; }
        .card-head { background: linear-gradient(135deg, var(--maroon), var(--maroon-light)); color: #fff; padding: 28px; text-align: center; }
        .card-head h1 { font-family: 'Playfair Display', serif; font-size: 1.6rem; }
        .card-head p { font-size: 0.85rem; opacity: 0.9; margin-top: 6px; }
        .card-body { padding: 28px; }
        label { font-size: 0.9rem; font-weight: 500; display: block; margin-bottom: 8px; }
        input { width: 100%; padding: 13px 15px; border: 2px solid #eee; border-radius: 8px;
                font-family: inherit; font-size: 1rem; }
        input:focus { outline: none; border-color: var(--maroon-light); }
        .btn { width: 100%; margin-top: 18px; padding: 13px; border: none; border-radius: 8px;
               background: linear-gradient(135deg, var(--maroon), var(--maroon-light)); color: #fff;
               font-weight: 600; font-size: 1rem; cursor: pointer; transition: opacity .2s; }
        .btn:disabled { opacity: .6; cursor: not-allowed; }
        .msg { margin-top: 16px; font-size: 0.9rem; padding: 12px 14px; border-radius: 8px; display: none; }
        .msg.ok { display: block; background: #eef7ef; color: #1e7a34; border: 1px solid #cfe8d4; }
        .msg.err { display: block; background: #fdecea; color: #c0392b; border: 1px solid #f5c6cb; }
        .back { display: block; text-align: center; margin-top: 20px; color: var(--maroon-light); text-decoration: none; font-size: 0.9rem; }
        .back:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card">
        <div class="card-head">
            <h1>Forgot Password?</h1>
            <p>Enter your email and we'll send you a reset link.</p>
        </div>
        <div class="card-body">
            <form id="forgotForm">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">
                <button class="btn" type="submit" id="submitBtn">Send Reset Link</button>
                <div class="msg" id="msg"></div>
            </form>
            <a class="back" th:href="@{/login_register}"><i class="fas fa-arrow-left"></i> Back to Sign In</a>
        </div>
    </div>

    <script>
        function getCsrf() {
            var m = document.cookie.match(/(?:^|;\s*)XSRF-TOKEN=([^;]+)/);
            return m ? decodeURIComponent(m[1]) : '';
        }
        var form = document.getElementById('forgotForm');
        var msg = document.getElementById('msg');
        var btn = document.getElementById('submitBtn');
        form.addEventListener('submit', async function (e) {
            e.preventDefault();
            var email = document.getElementById('email').value.trim();
            if (!email) return;
            btn.disabled = true; var orig = btn.textContent; btn.textContent = 'Sending…';
            msg.className = 'msg';
            try {
                var res = await fetch('/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded', 'X-XSRF-TOKEN': getCsrf() },
                    body: new URLSearchParams({ email: email })
                });
                var data = await res.json().catch(function () { return null; });
                if (res.ok) {
                    msg.textContent = (data && data.message) || 'A password reset link has been sent to your email.';
                    msg.className = 'msg ok';
                    form.querySelector('input').value = '';
                } else {
                    msg.textContent = (data && data.message) || 'Something went wrong. Please try again.';
                    msg.className = 'msg err';
                }
            } catch (err) {
                msg.textContent = 'Network error. Please try again.';
                msg.className = 'msg err';
            } finally {
                btn.disabled = false; btn.textContent = orig;
            }
        });
    </script>
</body>
</html>
