<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Mokshitha Collections</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root { --maroon: #55000c; --maroon-light: #880012; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: #f3ede6; color: #2c3e50;
               min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .card { background: #fff; width: 100%; max-width: 430px; border-radius: 16px;
                box-shadow: 0 20px 50px -20px rgba(0,0,0,0.25); overflow: hidden; }
        .card-head { background: linear-gradient(135deg, var(--maroon), var(--maroon-light)); color: #fff; padding: 28px; text-align: center; }
        .card-head h1 { font-family: 'Playfair Display', serif; font-size: 1.6rem; }
        .card-body { padding: 28px; }
        label { font-size: 0.9rem; font-weight: 500; display: block; margin-bottom: 8px; }
        .field { position: relative; margin-bottom: 16px; }
        input { width: 100%; padding: 13px 44px 13px 15px; border: 2px solid #eee; border-radius: 8px;
                font-family: inherit; font-size: 1rem; }
        input:focus { outline: none; border-color: var(--maroon-light); }
        .toggle { position: absolute; top: 50%; right: 12px; transform: translateY(-50%);
                  background: none; border: none; cursor: pointer; color: #888; }
        .hint { font-size: 0.8rem; color: #6b7280; margin-top: -8px; margin-bottom: 14px; }
        .btn { width: 100%; padding: 13px; border: none; border-radius: 8px;
               background: linear-gradient(135deg, var(--maroon), var(--maroon-light)); color: #fff;
               font-weight: 600; font-size: 1rem; cursor: pointer; transition: opacity .2s; }
        .btn:disabled { opacity: .6; cursor: not-allowed; }
        .msg { margin-top: 16px; font-size: 0.9rem; padding: 12px 14px; border-radius: 8px; display: none; }
        .msg.ok { display: block; background: #eef7ef; color: #1e7a34; border: 1px solid #cfe8d4; }
        .msg.err { display: block; background: #fdecea; color: #c0392b; border: 1px solid #f5c6cb; }
        .link { display: block; text-align: center; margin-top: 20px; color: var(--maroon-light); text-decoration: none; font-size: 0.9rem; }
        .link:hover { text-decoration: underline; }
        .invalid-box { text-align: center; }
        .invalid-box i { font-size: 2.4rem; color: #c0392b; margin-bottom: 12px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="card-head"><h1>Reset Password</h1></div>
        <div class="card-body">

            <!-- Invalid / expired token -->
            <div class="invalid-box" th:unless="${validToken}">
                <i class="fas fa-triangle-exclamation"></i>
                <p style="margin-bottom:6px;font-weight:600;">This reset link is invalid or has expired.</p>
                <p style="font-size:0.9rem;color:#666;">Reset links are valid for a short time and can be used once.</p>
                <a class="link" th:href="@{/forgot-password}">Request a new reset link</a>
            </div>

            <!-- Valid token → show the form -->
            <form id="resetForm" th:if="${validToken}">
                <input type="hidden" id="token" th:value="${token}">
                <label for="newPassword">New Password</label>
                <div class="field">
                    <input type="password" id="newPassword" autocomplete="new-password" required>
                    <button type="button" class="toggle" data-target="newPassword"><i class="fas fa-eye"></i></button>
                </div>
                <div class="hint">At least 8 characters, including a letter and a number.</div>
                <label for="confirmPassword">Confirm New Password</label>
                <div class="field">
                    <input type="password" id="confirmPassword" autocomplete="new-password" required>
                    <button type="button" class="toggle" data-target="confirmPassword"><i class="fas fa-eye"></i></button>
                </div>
                <button class="btn" type="submit" id="submitBtn">Reset Password</button>
                <div class="msg" id="msg"></div>
            </form>

            <a class="link" th:if="${validToken}" th:href="@{/login_register}"><i class="fas fa-arrow-left"></i> Back to Sign In</a>
        </div>
    </div>

    <script>
        function getCsrf() {
            var m = document.cookie.match(/(?:^|;\s*)XSRF-TOKEN=([^;]+)/);
            return m ? decodeURIComponent(m[1]) : '';
        }
        // Show/hide password toggles
        document.querySelectorAll('.toggle').forEach(function (b) {
            b.addEventListener('click', function () {
                var inp = document.getElementById(b.dataset.target);
                var icon = b.querySelector('i');
                if (inp.type === 'password') { inp.type = 'text'; icon.className = 'fas fa-eye-slash'; }
                else { inp.type = 'password'; icon.className = 'fas fa-eye'; }
            });
        });

        var form = document.getElementById('resetForm');
        if (form) form.addEventListener('submit', async function (e) {
            e.preventDefault();
            var msg = document.getElementById('msg');
            var btn = document.getElementById('submitBtn');
            var token = document.getElementById('token').value;
            var np = document.getElementById('newPassword').value;
            var cp = document.getElementById('confirmPassword').value;

            msg.className = 'msg';
            if (np !== cp) { msg.textContent = 'Passwords do not match'; msg.className = 'msg err'; return; }
            if (np.length < 8) { msg.textContent = 'Password must be at least 8 characters'; msg.className = 'msg err'; return; }

            btn.disabled = true; var orig = btn.textContent; btn.textContent = 'Resetting…';
            try {
                var res = await fetch('/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded', 'X-XSRF-TOKEN': getCsrf() },
                    body: new URLSearchParams({ token: token, newPassword: np, confirmPassword: cp })
                });
                var data = await res.json().catch(function () { return null; });
                if (res.ok) {
                    form.style.display = 'none';
                    msg.textContent = (data && data.message) || 'Your password has been reset.';
                    msg.className = 'msg ok';
                    setTimeout(function () { window.location.href = '/login_register'; }, 1800);
                } else {
                    msg.textContent = (data && data.message) || 'Could not reset password.';
                    msg.className = 'msg err';
                    btn.disabled = false; btn.textContent = orig;
                }
            } catch (err) {
                msg.textContent = 'Network error. Please try again.';
                msg.className = 'msg err';
                btn.disabled = false; btn.textContent = orig;
            }
        });
    </script>
</body>
</html>
